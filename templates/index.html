<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart Disease Prediction</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="max-w-5xl mx-auto py-10 px-4">
    <!-- Header -->
    <header class="text-center mb-8">
      <div class="inline-flex p-3 bg-red-100 text-red-600 rounded-full mb-2">
        <svg class="w-8 h-8 fill-current" viewBox="0 0 24 24">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-slate-900">Heart Failure Clinical Predictor</h1>
      <p class="text-slate-500 text-sm mt-1">Random Forest Prediction Model</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Input Form -->
      <form id="heartForm" class="lg:col-span-2 bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
        <h2 class="text-base font-semibold text-slate-800 border-b pb-2">Clinical Parameters</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
          <div>
            <label class="block font-medium text-slate-600 mb-1">Age</label>
            <input type="number" id="Age" value="50" min="20" max="100" class="w-full border rounded-md p-2 focus:ring-2 focus:ring-red-500 outline-none" required />
          </div>

          <div>
            <label class="block font-medium text-slate-600 mb-1">Sex</label>
            <select id="Sex" class="w-full border rounded-md p-2 focus:ring-2 focus:ring-red-500 outline-none">
              <option value="M">Male (M)</option>
              <option value="F">Female (F)</option>
            </select>
          </div>

          <div>
            <label class="block font-medium text-slate-600 mb-1">Chest Pain Type</label>
            <select id="ChestPainType" class="w-full border rounded-md p-2 focus:ring-2 focus:ring-red-500 outline-none">
              <option value="ASY">ASY (Asymptomatic)</option>
              <option value="ATA">ATA (Atypical Angina)</option>
              <option value="NAP">NAP (Non-Anginal Pain)</option>
              <option value="TA">TA (Typical Angina)</option>
            </select>
          </div>

          <div>
            <label class="block font-medium text-slate-600 mb-1">Resting Blood Pressure (mm Hg)</label>
            <input type="number" id="RestingBP" value="130" min="50" max="250" class="w-full border rounded-md p-2 focus:ring-2 focus:ring-red-500 outline-none" required />
          </div>

          <div>
            <label class="block font-medium text-slate-600 mb-1">Serum Cholesterol (mm/dl)</label>
            <input type="number" id="Cholesterol" value="230" min="0" max="600" class="w-full border rounded-md p-2 focus:ring-2 focus:ring-red-500 outline-none" required />
          </div>

          <div>
            <label class="block font-medium text-slate-600 mb-1">Fasting Blood Sugar</label>
            <select id="FastingBS" class="w-full border rounded-md p-2 focus:ring-2 focus:ring-red-500 outline-none">
              <option value="0">Normal (<= 120 mg/dl)</option>
              <option value="1">Elevated (> 120 mg/dl)</option>
            </select>
          </div>

          <div>
            <label class="block font-medium text-slate-600 mb-1">Resting ECG</label>
            <select id="RestingECG" class="w-full border rounded-md p-2 focus:ring-2 focus:ring-red-500 outline-none">
              <option value="Normal">Normal</option>
              <option value="ST">ST-T wave abnormality</option>
              <option value="LVH">Left Ventricular Hypertrophy (LVH)</option>
            </select>
          </div>

          <div>
            <label class="block font-medium text-slate-600 mb-1">Max Heart Rate (MaxHR)</label>
            <input type="number" id="MaxHR" value="140" min="60" max="220" class="w-full border rounded-md p-2 focus:ring-2 focus:ring-red-500 outline-none" required />
          </div>

          <div>
            <label class="block font-medium text-slate-600 mb-1">Exercise-Induced Angina</label>
            <select id="ExerciseAngina" class="w-full border rounded-md p-2 focus:ring-2 focus:ring-red-500 outline-none">
              <option value="N">No (N)</option>
              <option value="Y">Yes (Y)</option>
            </select>
          </div>

          <div>
            <label class="block font-medium text-slate-600 mb-1">Oldpeak (ST Depression)</label>
            <input type="number" step="0.1" id="Oldpeak" value="1.0" min="-2.0" max="7.0" class="w-full border rounded-md p-2 focus:ring-2 focus:ring-red-500 outline-none" required />
          </div>

          <div class="sm:col-span-2">
            <label class="block font-medium text-slate-600 mb-1">ST Slope</label>
            <select id="ST_Slope" class="w-full border rounded-md p-2 focus:ring-2 focus:ring-red-500 outline-none">
              <option value="Up">Up (Upsloping)</option>
              <option value="Flat">Flat</option>
              <option value="Down">Down (Downsloping)</option>
            </select>
          </div>
        </div>

        <button type="submit" class="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white font-medium rounded-md transition shadow mt-4">
          Run Prediction
        </button>
      </form>

      <!-- Output Panel -->
      <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
        <div>
          <h2 class="text-base font-semibold text-slate-800 border-b pb-2">Prediction Outcome</h2>

          <div id="placeholder" class="text-slate-400 text-sm mt-8 text-center">
            Submit the form to compute probability using the trained Random Forest model.
          </div>

          <div id="results" class="hidden mt-6 text-center space-y-4">
            <div>
              <span id="riskScore" class="text-5xl font-extrabold text-slate-900">--%</span>
              <div id="badge" class="mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide">
                --
              </div>
            </div>
            <p id="message" class="text-sm text-slate-600 border-t pt-4"></p>
          </div>
        </div>

        <div id="errorBox" class="hidden text-xs text-red-600 bg-red-50 p-3 rounded-md border border-red-200 mt-4"></div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("heartForm");
    const results = document.getElementById("results");
    const placeholder = document.getElementById("placeholder");
    const riskScore = document.getElementById("riskScore");
    const badge = document.getElementById("badge");
    const message = document.getElementById("message");
    const errorBox = document.getElementById("errorBox");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("hidden");

      const payload = {
        Age: document.getElementById("Age").value,
        Sex: document.getElementById("Sex").value,
        ChestPainType: document.getElementById("ChestPainType").value,
        RestingBP: document.getElementById("RestingBP").value,
        Cholesterol: document.getElementById("Cholesterol").value,
        FastingBS: document.getElementById("FastingBS").value,
        RestingECG: document.getElementById("RestingECG").value,
        MaxHR: document.getElementById("MaxHR").value,
        ExerciseAngina: document.getElementById("ExerciseAngina").value,
        Oldpeak: document.getElementById("Oldpeak").value,
        ST_Slope: document.getElementById("ST_Slope").value
      };

      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.message || "Prediction failed.");

        placeholder.classList.add("hidden");
        results.classList.remove("hidden");

        riskScore.innerText = `${data.risk_score}%`;
        message.innerText = data.message;

        if (data.prediction === 1) {
          riskScore.className = "text-5xl font-extrabold text-red-600";
          badge.className = "mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide bg-red-100 text-red-700";
          badge.innerText = "Heart Disease Detected";
        } else {
          riskScore.className = "text-5xl font-extrabold text-emerald-600";
          badge.className = "mt-2 inline-block px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide bg-emerald-100 text-emerald-700";
          badge.innerText = "Normal / Low Risk";
        }
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
